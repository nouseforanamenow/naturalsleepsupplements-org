name: Publish Scheduled Posts

on:
  schedule:
    - cron: '0 14 * * 2,5'
  workflow_dispatch:

permissions:
  contents: write

# Drains the oldest file in blog/scheduled/ into blog/, then makes the rest of
# the site agree with it: a real card in the blog index (same markup as the
# hand-built ones) and a canonical www sitemap entry carrying today's lastmod.
# The old version appended a bare <li> after the closing </div> and wrote a
# sitemap <loc> with no <lastmod> on the apex host, which 301s. Both fixed.
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Drain the oldest scheduled post
        id: drain
        run: |
          # Alphabetical, not mtime: a fresh checkout gives every file the same
          # mtime, so `ls -t` picked an arbitrary post.
          FILE=$(ls blog/scheduled/*.html 2>/dev/null | sort | head -1)
          if [ -z "$FILE" ]; then
            echo "queue is empty, nothing to publish"
            echo "moved=" >> $GITHUB_OUTPUT
            exit 0
          fi
          NAME=$(basename "$FILE")
          mv "$FILE" "blog/$NAME"
          echo "moved=$NAME" >> $GITHUB_OUTPUT
          echo "published blog/$NAME"

      - name: Add it to the blog index and the sitemap
        if: steps.drain.outputs.moved != ''
        env:
          NAME: ${{ steps.drain.outputs.moved }}
          DOMAIN: naturalsleepsupplements.org
        run: |
          python3 - <<'PY'
          import os, re, datetime, pathlib

          name = os.environ["NAME"]
          domain = os.environ["DOMAIN"]
          today = datetime.date.today().isoformat()
          post = pathlib.Path("blog") / name
          html = post.read_text(errors="ignore")

          m = re.search(r"<title>(.*?)</title>", html, re.S | re.I)
          title = re.split(r"\s*\|\s*",
                           re.sub(r"\s+", " ", m.group(1)).strip())[0] if m else post.stem
          m = re.search(r'<meta name="description" content="(.*?)"', html, re.S | re.I)
          desc = re.sub(r"\s+", " ", m.group(1)).strip() if m else ""

          idx = pathlib.Path("blog/index.html")
          if idx.exists():
              page = idx.read_text()
              if f'href="{name}"' not in page:
                  card = ('<article class="blog-card">\n'
                          f'<h2><a href="{name}">{title}</a></h2>\n'
                          f'<p>{desc}</p>\n'
                          '<span class="meta">Read more</span>\n'
                          '</article>\n')
                  cut = page.rfind("</article>")
                  if cut == -1:
                      page = page.replace("\n</div>", "\n" + card + "</div>", 1)
                  else:
                      cut += len("</article>")
                      page = page[:cut] + "\n\n" + card + page[cut:]
                  idx.write_text(page)
                  print("blog index: card added")

          sm = pathlib.Path("sitemap.xml")
          if sm.exists():
              s = sm.read_text()
              loc = f"https://www.{domain}/blog/{name}"
              if loc not in s:
                  entry = (f"  <url>\n    <loc>{loc}</loc>\n"
                           f"    <lastmod>{today}</lastmod>\n"
                           "    <changefreq>monthly</changefreq>\n"
                           "    <priority>0.7</priority>\n  </url>\n")
                  s = s.replace("</urlset>", entry + "</urlset>")
              # the blog index genuinely changed, so its lastmod moves too
              s = re.sub(r"(<loc>https://www\." + re.escape(domain) +
                         r"/blog/</loc>\s*<lastmod>)[0-9-]{10}",
                         lambda mm: mm.group(1) + today, s)
              sm.write_text(s)
              print("sitemap: entry added, blog index lastmod bumped")
          PY

      - name: Commit
        if: steps.drain.outputs.moved != ''
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add blog/ sitemap.xml
          if git diff --cached --quiet; then
            echo "nothing changed"
          else
            git commit -m "Publish scheduled post: ${{ steps.drain.outputs.moved }}"
            git push
          fi
